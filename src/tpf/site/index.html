  var sel = document.getElementById('types'), keep = sel.selectedIndex;
  fill(sel, t.types, function (s) { return el('option', s); }); if (keep > 0) sel.selectedIndex = keep;
}
// Each language has its own address (/ru, /en, /nl, /zh) with the page already filled in for search engines;
// on the bare address the visitor's own language is chosen here.
var PAGE_LANG = (location.pathname.match(/^\/(ru|en|nl|zh)\/?$/) || [])[1];
try { var saved = localStorage.getItem('tpf_lang'); if (PAGE_LANG) lang = PAGE_LANG; else if (I18N[saved]) lang = saved; else if (/^zh/i.test(navigator.language)) lang = 'zh'; else if (/^nl/i.test(navigator.language)) lang = 'nl'; else if (!/^(ru|be|uk|kk)/i.test(navigator.language)) lang = 'en'; } catch (e) {}
render();
// 'Describe the process' leads to the form with that kind of project already chosen.
var AUTO_TYPE = 5;
document.getElementById('auto-cta').addEventListener('click', function () { document.getElementById('types').selectedIndex = AUTO_TYPE; });

document.getElementById('form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var f = ev.target, t = T(), msg = document.getElementById('msg'), btn = document.getElementById('submit');
  function show(text, err, link) { msg.className = 'msg' + (err ? ' err' : ''); msg.textContent = text; if (link) { var a = el('a', t.ok_link); a.href = link; msg.append(a); } }
  if (f.website.value) return;                       // bots fill the hidden field
  var name = f.name.value.trim(), email = f.email.value.trim(), about = f.about.value.trim();
  var file = f.video.files && f.video.files[0];
  if (!name || !/^\S+@\S+\.\S+$/.test(email) || (about.length < 10 && !file)) { show(t.e_fields, true); return; }
  if (file && file.size > 50 * 1024 * 1024) { show(t.e_video, true); return; }
  if (!about) about = t.in_video;
  btn.disabled = true; show(file ? t.uploading + '0%' : t.sending);
  function json(r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); }
  // A video goes up first, in pieces; the order is created once the whole file has arrived.
  function upload() {
    if (!file) return Promise.resolve(null);
    return fetch('/uploads', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ size: file.size, filename: file.name || 'video.mp4' }) }).then(json).then(function (r) {
        if (!r.ok) throw new Error(r.status === 429 ? 'busy' : 'upload');
        var u = r.d, n = 0;
        function next() {
          if (n >= u.chunks) return { id: u.id, token: u.token };
          var piece = file.slice(n * u.chunk_size, Math.min((n + 1) * u.chunk_size, file.size)), tries = 0;
          function put() {
            return fetch('/uploads/' + u.id + '/chunks/' + n, { method: 'PUT', body: piece,
              headers: { 'content-type': 'application/octet-stream', 'x-upload-token': u.token } }).then(function (c) {
                if (!c.ok) throw new Error('upload');
              }).catch(function (e) { if (++tries < 3) return put(); throw e; });
          }
          return put().then(function () { n++; show(t.uploading + Math.round(100 * n / u.chunks) + '%'); return next(); });
        }
        return next();
      });
  }
  upload().then(function (video) {
    if (file) show(t.sending);
    return fetch('/orders', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ client_name: name, client_email: email, language: lang === 'nl' ? 'en' : lang, channel: 'site',
        request_text: '[' + f.type.value + '] ' + about, video: video, currency: f.currency.value }) }).then(json);
  }).then(function (r) {
      if (r.ok) { f.reset(); show(file ? t.ok_video : t.ok, false, r.d.portal_url); }
      else show(r.status === 429 ? t.e_busy : r.status === 422 ? t.e_fields : t.e_fail, true);
    })
    .catch(function (e) { show(e && e.message === 'busy' ? t.e_busy : e && e.message === 'upload' ? t.e_upload : t.e_fail, true); })
    .finally(function () { btn.disabled = false; });
});
</script>
