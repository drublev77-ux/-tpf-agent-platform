name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    name: Claude review
    if: ${{ github.event.pull_request.head.repo.fork == false && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-3-5-sonnet-20241022' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip fork PRs
        if: ${{ github.event.pull_request.head.repo.fork == true }}
        shell: bash
        run: |
          echo "Skipping review for fork PRs to avoid running secret-bearing code on untrusted changes."

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate API key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Missing ANTHROPIC_API_KEY secret. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Resolve target PR number and prompt
        id: target
        shell: bash
        run: |
          set -euo pipefail
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "prompt=Review the pull request for logic bugs, security issues, and maintainability improvements. Focus on the diff and mention concrete risks." >> "$GITHUB_OUTPUT"

      - name: Build diff
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --unified=3 "$base"..."$head" > /tmp/claude.diff || true

          if [ ! -s /tmp/claude.diff ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "No diff available for review." > /tmp/claude.diff
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Claude for review
        id: claude
        shell: bash
        env:
          REVIEW_PROMPT: ${{ steps.target.outputs.prompt }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail
          python3 scripts/claude_review.py

      - name: Post review comment to PR
        if: ${{ steps.target.outputs.pr_number != '0' }}
        shell: bash
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/claude_response.txt ]; then
            echo "No Claude response generated."
            exit 0
          fi
          python3 scripts/post_review_comment.py

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo "Claude review workflow finished."
          if [ -s /tmp/claude_response.txt ]; then
            echo "Preview:"
            head -n 20 /tmp/claude_response.txt
          fi
