name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    name: Claude review
    if: ${{ github.event.pull_request.head.repo.fork == false && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-3-5-sonnet-20241022' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip fork PRs
        if: ${{ github.event.pull_request.head.repo.fork == true }}
        shell: bash
        run: |
          echo "Skipping review for fork PRs to avoid running secret-bearing code on untrusted changes."

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate API key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Missing ANTHROPIC_API_KEY secret. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Resolve target PR number and prompt
        id: target
        shell: bash
        run: |
          set -euo pipefail
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "prompt=Review the pull request for logic bugs, security issues, and maintainability improvements. Focus on the diff and mention concrete risks." >> "$GITHUB_OUTPUT"

      - name: Build diff
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --unified=3 "$base"..."$head" > /tmp/claude.diff || true

          if [ ! -s /tmp/claude.diff ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "No diff available for review." > /tmp/claude.diff
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Claude for review
        id: claude
        shell: bash
        env:
          REVIEW_PROMPT: ${{ steps.target.outputs.prompt }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
import json
import os
import subprocess
import sys

repo = os.environ['REPO']
pr_number = os.environ.get('PR_NUMBER', '0')
review_prompt = os.environ.get('REVIEW_PROMPT', '').strip()


def read_file(path):
    try:
        with open(path, 'r', encoding='utf-8') as f:
            return f.read()
    except Exception:
        return ''


system_prompt = (
    'You are a senior software engineer and code reviewer. '
    'Review the patch for correctness, security, maintainability, and testability. '
    'Be precise, concrete, and actionable. Do not invent facts. '
    'If there are no issues, say so clearly. '
    'Prioritize real risk over stylistic preferences.'
)

user_message = (
    f"Repository: {repo}\n"
    f"PR number: {pr_number if pr_number and pr_number != '0' else 'manual run'}\n\n"
    f"Instruction: {review_prompt}\n\n"
    "Review the following diff and answer in Russian unless the user explicitly asks otherwise.\n\n"
    "Provide: 1) Key findings, 2) Risks, 3) Suggested fixes.\n\n"
    "Diff:\n```diff\n"
    f"{read_file('/tmp/claude.diff')}\n"
    "```"
)

payload = {
    "model": os.environ['ANTHROPIC_MODEL'],
    "max_tokens": 1800,
    "system": system_prompt,
    "messages": [
        {"role": "user", "content": user_message}
    ],
}

proc = subprocess.run(
    [
        'curl', '-sS',
        'https://api.anthropic.com/v1/messages',
        '-H', 'x-api-key: ' + os.environ['ANTHROPIC_API_KEY'],
        '-H', 'anthropic-version: 2023-06-01',
        '-H', 'content-type: application/json',
        '--data-binary', json.dumps(payload),
    ],
    capture_output=True,
    text=True,
)

if proc.returncode != 0:
    print(proc.stderr, file=sys.stderr)
    raise SystemExit(proc.returncode)

raw = proc.stdout.strip()
print(raw)

try:
    data = json.loads(raw)
    result = data['content'][0]['text']
except Exception as exc:
    print(f'Failed to parse response from Anthropic: {exc}', file=sys.stderr)
    print(raw, file=sys.stderr)
    raise

with open('/tmp/claude_response.txt', 'w', encoding='utf-8') as f:
    f.write(result)

with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
    out.write(f"response<<EOF\n{result}\nEOF\n")
PY

      - name: Post review comment to PR
        if: ${{ steps.target.outputs.pr_number != '0' }}
        shell: bash
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail

          if [ ! -s /tmp/claude_response.txt ]; then
            echo "No Claude response generated."
            exit 0
          fi

          payload=$(python3 - <<'PY'
import json
with open('/tmp/claude_response.txt', 'r', encoding='utf-8') as f:
    text = f.read().strip()
print(json.dumps({"body": "### Claude review\n\n" + text}))
PY
)

          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments \
            -d "$payload"

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo "Claude review workflow finished."
          if [ -s /tmp/claude_response.txt ]; then
            echo "Preview:"
            head -n 20 /tmp/claude_response.txt
          fi
