name: Claude Assistant

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom prompt for Claude'
        required: false
        default: 'Review the current repository state and summarize key risks.'

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/claude')) ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      pull-requests: write
      issues: write

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-3-5-sonnet-20241022' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine target PR/issue
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "context=PR" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "comment_target=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "context=COMMENT" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "comment_target=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=0" >> "$GITHUB_OUTPUT"
            echo "context=MANUAL" >> "$GITHUB_OUTPUT"
            echo "comment_target=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Missing ANTHROPIC_API_KEY secret. Add it in repository settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Build diff context
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "issue_comment" ]; then
            if git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
              git diff --unified=3 "$BASE_SHA"..."$HEAD_SHA" > /tmp/claude.diff || true
            else
              git diff --unified=3 HEAD~1 HEAD > /tmp/claude.diff || true
            fi
          else
            git status --short > /tmp/claude.diff || true
          fi

          if [ ! -s /tmp/claude.diff ]; then
            echo "diff_empty=true" >> "$GITHUB_OUTPUT"
            echo "No diff available for review." > /tmp/claude.diff
          else
            echo "diff_empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Claude for review
        id: ask
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          MANUAL_PROMPT: ${{ github.event.inputs.prompt }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
import json
import os
import subprocess
import sys

repo = os.environ['REPO_NAME']
pr_number = os.environ.get('PR_NUMBER', '0')
manual_prompt = os.environ.get('MANUAL_PROMPT', '').strip()
comment_body = os.environ.get('COMMENT_BODY', '').strip()

def read_file(path):
    try:
        with open(path, 'r', encoding='utf-8') as f:
            return f.read()
    except Exception:
        return ''

# Build prompt
prompt_lines = []
prompt_lines.append('Ты — senior software engineer и code reviewer.')
prompt_lines.append('Проанализируй изменения в проекте и дай конструктивный review.')
prompt_lines.append(f'Репозиторий: {repo}')
if pr_number and pr_number != '0':
    prompt_lines.append(f'PR/issue: #{pr_number}')

if os.environ.get('EVENT_NAME') == 'issue_comment' and comment_body:
    prompt_lines.append('Пользователь попросил:')
    prompt_lines.append(comment_body)

if os.environ.get('EVENT_NAME') == 'workflow_dispatch' and manual_prompt:
    prompt_lines.append('Дополнительный custom prompt:')
    prompt_lines.append(manual_prompt)

prompt_lines.append('')
prompt_lines.append('Контекст diff:')
prompt_lines.append('```diff')
prompt_lines.append(read_file('/tmp/claude.diff'))
prompt_lines.append('```')

prompt = '\n'.join(prompt_lines)

payload = {
    'model': os.environ['ANTHROPIC_MODEL'],
    'max_tokens': 2000,
    'messages': [
        {'role': 'user', 'content': prompt}
    ],
}

proc = subprocess.run(
    ['curl', '-sS', 'https://api.anthropic.com/v1/messages',
     '-H', 'x-api-key: ' + os.environ['ANTHROPIC_API_KEY'],
     '-H', 'anthropic-version: 2023-06-01',
     '-H', 'content-type: application/json',
     '--data-binary', json.dumps(payload)],
    capture_output=True,
    text=True,
)

if proc.returncode != 0:
    print(proc.stderr)
    raise SystemExit(proc.returncode)

resp_text = proc.stdout.strip()
print(resp_text)

try:
    data = json.loads(resp_text)
    text = data['content'][0]['text']
except Exception as e:
    print(f'Failed to parse Anthropic response: {e}', file=sys.stderr)
    print(resp_text, file=sys.stderr)
    raise

# Save response to output file for posting later
with open('/tmp/claude_response.txt', 'w', encoding='utf-8') as f:
    f.write(text)

# Save as GITHUB_OUTPUT
with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
    out.write(f"response<<EOF\n{text}\nEOF\n")
PY

      - name: Post Claude review comment
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -euo pipefail

          if [ ! -s /tmp/claude_response.txt ]; then
            echo 'Claude did not return a response.'
            exit 0
          fi

          response=$(cat /tmp/claude_response.txt)
          body=$(cat <<EOF
          Claude review:

          $response
          EOF
          )

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "issue_comment" ]; then
            if [ "$PR_NUMBER" = "0" ] || [ -z "$PR_NUMBER" ]; then
              echo "No PR number to comment on."
              exit 0
            fi

            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments \
              -d "$(python3 - <<'PY'
import json, os
body = open('/tmp/claude_response.txt', 'r', encoding='utf-8').read().strip()
print(json.dumps({"body": "Claude review:\n\n" + body}))
PY
)"
          else
            echo "Manual run: no PR comment was posted."
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "Claude workflow completed."
          if [ -s /tmp/claude_response.txt ]; then
            echo "Preview:"
            head -n 20 /tmp/claude_response.txt
          fi
