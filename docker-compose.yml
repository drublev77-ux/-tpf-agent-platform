services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tpf
      POSTGRES_PASSWORD: tpf
      POSTGRES_DB: tpf
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpf"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: tpf-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tpf:tpf@db:5432/tpf
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    command: tpf-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tpf:tpf@db:5432/tpf
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: .
    command: tpf-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tpf:tpf@db:5432/tpf
    # The worker starts sandbox containers for builds. Mounting the Docker socket gives it
    # control of the host's Docker: run the worker on a dedicated build host, not next to production.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspaces:/workspaces
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 2

volumes:
  pgdata:
  workspaces:
